<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katroz | Objects</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f7f5f0;
            --text-main: #2b2b2b;
            --text-muted: #7a7a7a;
            --border-color: #d6cec1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }

        /* ШАПКА */
        header { 
            text-align: center; 
            margin-bottom: 30px; 
        }
        header h1 { 
            font-family: 'Cormorant Garamond', serif;
            font-size: 4rem;
            font-weight: 400;
            letter-spacing: 0.15em; 
            text-transform: uppercase;
        }

        /* МЕНЮ */
        nav {
            display: flex;
            justify-content: center;
            gap: 40px;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 0;
            margin-bottom: 40px;
        }
        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: color 0.3s;
        }
        nav a:hover { color: var(--text-muted); }

        /* СЛАЙДЕР */
        .slider-container {
            position: relative;
            width: 100%;
            height: 70vh; /* Высота почти на весь экран */
            min-height: 400px;
            overflow: hidden;
            margin-bottom: 80px;
            background-color: #e8e4dd;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 1rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .slide.active { display: flex; }

        /* Стрелки */
        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(247, 245, 240, 0.7);
            border: none;
            width: 60px;
            height: 60px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-main);
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .slider-btn:hover { background: var(--bg-color); }
        .slider-btn.prev { left: 20px; }
        .slider-btn.next { right: 20px; }

        /* СЕТКА (3 в ряд) */
        .gallery-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .photo-wrapper {
            position: relative;
            overflow: hidden;
            background-color: #e8e4dd;
            aspect-ratio: 1 / 1; /* Квадратные фото для сетки */
            cursor: pointer;
            display: block;
        }

        .photo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .photo-wrapper:hover .photo-img {
            transform: scale(1.08);
        }

        /* ПОДВАЛ */
        footer {
            margin-top: 100px;
            padding-top: 40px;
            text-align: center;
            border-top: 1px solid var(--border-color);
        }

        .contact-btn {
            display: inline-block;
            background-color: transparent;
            color: var(--text-main);
            text-decoration: none;
            padding: 12px 30px;
            border: 1px solid var(--text-main);
            border-radius: 2px;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            transition: all 0.3s;
        }
        
        .contact-btn:hover { 
            background-color: var(--text-main);
            color: var(--bg-color);
        }

        @media (max-width: 768px) {
            header h1 { font-size: 2.5rem; }
            nav { gap: 20px; }
            .gallery { grid-template-columns: 1fr; }
            .slider-container { height: 50vh; }
            .slider-btn { width: 40px; height: 40px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ШАПКА -->
        <header>
            <h1>Katroz</h1>
        </header>

        <!-- МЕНЮ -->
        <nav>
            <a href="#">Коллекции</a>
            <a href="#">Архив</a>
            <a href="#">О нас</a>
        </nav>

        <!-- СЛАЙДЕР -->
        <section class="slider-container">
            <!-- Слайд 1 -->
            <div class="slide active">Большое фото объекта 1</div>
            <!-- Слайд 2 -->
            <div class="slide">Большое фото объекта 2</div>
            <!-- Слайд 3 -->
            <div class="slide">Большое фото объекта 3</div>

            <button class="slider-btn prev" onclick="changeSlide(-1)">&#10094;</button>
            <button class="slider-btn next" onclick="changeSlide(1)">&#10095;</button>
        </section>

        <!-- СЕТКА -->
        <h2 class="gallery-title">Избранное</h2>
        <section class="gallery">
            <a href="https://t.me/ВАШ_НИК" target="_blank" class="photo-wrapper">
                <div class="photo-img">Фото 1</div>
            </a>
            <a href="https://t.me/ВАШ_НИК" target="_blank" class="photo-wrapper">
                <div class="photo-img">Фото 2</div>
            </a>
            <a href="https://t.me/ВАШ_НИК" target="_blank" class="photo-wrapper">
                <div class="photo-img">Фото 3</div>
            </a>
            <a href="https://t.me/ВАШ_НИК" target="_blank" class="photo-wrapper">
                <div class="photo-img">Фото 4</div>
            </a>
            <a href="https://t.me/ВАШ_НИК" target="_blank" class="photo-wrapper">
                <div class="photo-img">Фото 5</div>
            </a>
            <a href="https://t.me/ВАШ_НИК" target="_blank" class="photo-wrapper">
                <div class="photo-img">Фото 6</div>
            </a>
        </section>

        <!-- ПОДВАЛ -->
        <footer>
            <!-- ЗАМЕНИ ССЫЛКУ НА СВОЙ ТЕЛЕГРАМ -->
            <a href="https://t.me/ВАШ_НИК" class="contact-btn" target="_blank">Связаться</a>
        </footer>

    </div>

    <!-- СКРИПТ ДЛЯ СЛАЙДЕРА -->
    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');

        function showSlide(index) {
            slides.forEach(slide => slide.classList.remove('active'));
            slides[index].classList.add('active');
        }

        function changeSlide(direction) {
            currentSlide += direction;
            if (currentSlide >= slides.length) {
                currentSlide = 0;
            }
            if (currentSlide < 0) {
                currentSlide = slides.length - 1;
            }
            showSlide(currentSlide);
        }
    </script>
</body>
</html>
