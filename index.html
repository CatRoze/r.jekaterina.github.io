<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katroz | Objects</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f7f5f0; /* Теплый кремовый */
            --text-main: #2b2b2b; /* Графит */
            --text-muted: #7a7a7a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 60px 24px; }

        /* ШАПКА */
        header { 
            text-align: center; 
            margin-bottom: 80px; 
            padding-top: 40px;
        }
        header h1 { 
            font-family: 'Cormorant Garamond', serif;
            font-size: 5rem; /* Крупный заголовок */
            font-weight: 400;
            letter-spacing: 0.15em; 
            text-transform: uppercase;
            color: var(--text-main);
        }

        /* СЕТКА ГАЛЕРЕИ */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); /* Автоматическая сетка */
            gap: 20px; /* Отступы между фото */
        }

        /* БЛОК ФОТО */
        .photo-wrapper {
            position: relative;
            overflow: hidden; /* Чтобы увеличенное фото не вылезало за края */
            background-color: #e8e4dd;
            aspect-ratio: 4 / 5; /* Пропорции фото (вертикальные) */
            cursor: pointer;
            display: block;
        }

        /* Сама картинка (заглушка) */
        .photo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s ease; /* Плавное увеличение */
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* ЭФФЕКТ ПРИ НАВЕДЕНИИ */
        .photo-wrapper:hover .photo-img {
            transform: scale(1.08); /* Увеличение на 8% */
        }

        /* ПОДВАЛ */
        footer {
            margin-top: 100px;
            padding-top: 40px;
            text-align: center;
        }

        .contact-btn {
            display: inline-block;
            background-color: transparent;
            color: var(--text-main);
            text-decoration: none;
            padding: 12px 30px;
            border: 1px solid var(--text-main);
            border-radius: 2px;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            transition: all 0.3s;
        }
        
        .contact-btn:hover { 
            background-color: var(--text-main);
            color: var(--bg-color);
        }

        @media (max-width: 768px) {
            header h1 { font-size: 3rem; }
            .gallery { grid-template-columns: 1fr; } /* На телефоне в одну колонку */
            .container { padding: 30px 16px; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ШАПКА -->
        <header>
            <h1>Katroz</h1>
        </header>

        <!-- СЕТКА С ФОТО -->
        <!-- Сейчас там стоят заглушки, скоро мы их заменим на твои фото -->
        <section class="gallery">
            
            <a href="https://t.me/ВАШ_НИК" target="_blank" class="photo-wrapper">
                <div class="photo-img">Фото 1</div>
            </a>

            <a href="https://t.me/ВАШ_НИК" target="_blank" class="photo-wrapper">
                <div class="photo-img">Фото 2</div>
            </a>

            <a href="https://t.me/ВАШ_НИК" target="_blank" class="photo-wrapper">
                <div class="photo-img">Фото 3</div>
            </a>

            <a href="https://t.me/ВАШ_НИК" target="_blank" class="photo-wrapper">
                <div class="photo-img">Фото 4</div>
            </a>

            <a href="https://t.me/ВАШ_НИК" target="_blank" class="photo-wrapper">
                <div class="photo-img">Фото 5</div>
            </a>

            <a href="https://t.me/ВАШ_НИК" target="_blank" class="photo-wrapper">
                <div class="photo-img">Фото 6</div>
            </a>

        </section>

        <!-- ПОДВАЛ -->
        <footer>
            <!-- ЗАМЕНИ ССЫЛКУ НА СВОЙ ТЕЛЕГРАМ -->
            <a href="https://t.me/ВАШ_НИК" class="contact-btn" target="_blank">Связаться</a>
        </footer>

    </div>
</body>
</html>
